<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Penny</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef7ff, #ffffff);
            color: #123;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #dceeff;
            padding: 12px 20px;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo img {
            width: 130px;
            height: 55px;
            object-fit: contain;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            margin: 40px auto;
            padding: 20px;
            flex: 1;
        }

        .login-box {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 100, 200, 0.10);
            border: 1px solid #e1f0ff;
        }

        .login-box h1 {
            text-align: center;
            color: #087bea;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #687789;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #26384a;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cddfed;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background: #fbfdff;
        }

        input:focus {
            border-color: #087bea;
            box-shadow: 0 0 0 3px rgba(8, 123, 234, 0.08);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 75px;
        }

        .show-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: #eaf5ff;
            color: #087bea;
            padding: 7px 9px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -7px;
            margin-bottom: 20px;
            color: #087bea;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            border: none;
            padding: 14px;
            background: #087bea;
            color: white;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0568c8;
        }

        .login-btn:disabled {
            background: #9bbfe5;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 17px;
            font-size: 14px;
            text-align: center;
        }

        .message.error {
            display: block;
            background: #ffecec;
            color: #c62828;
        }

        .message.success {
            display: block;
            background: #eafaf0;
            color: #16803c;
        }

        .register-text {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #687789;
        }

        .register-text a {
            color: #087bea;
            font-weight: bold;
            text-decoration: none;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #555;
            text-decoration: none;
            font-size: 13px;
        }

        .home-link:hover {
            color: #087bea;
        }

        footer {
            text-align: center;
            padding: 18px 10px;
            color: #718096;
            font-size: 13px;
            background: #ffffff;
            border-top: 1px solid #e4eff8;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px auto;
                padding: 15px;
            }

            .login-box {
                padding: 25px 18px;
                border-radius: 14px;
            }

            .login-box h1 {
                font-size: 25px;
            }

            .logo img {
                width: 115px;
                height: 50px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <img src="./images/penny1.jpg" alt="Penny Logo">
        </div>
    </header>

    <div class="login-container">

        <div class="login-box">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your Penny account
            </p>

            <div id="message" class="message"></div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginInput">
                        Email or Username
                    </label>

                    <input type="text" id="loginInput" placeholder="Enter your email or username"
                        autocomplete="username" required>
                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="password" placeholder="Enter your password"
                            autocomplete="current-password" required>

                        <button type="button" class="show-password" id="togglePassword">
                            Show
                        </button>

                    </div>

                </div>

                <a href="forgot-password.html" class="forgot">
                    Forgot Password?
                </a>

                <button type="submit" class="login-btn" id="loginButton">
                    Login
                </button>

            </form>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

            <a href="index.html" class="home-link">
                ← Back to Home
            </a>

        </div>

    </div>

    <footer>
        © 2026 Penny. All rights reserved.
    </footer>


    <script>

        /* =========================================
           SUPABASE CONNECTION
           ========================================= */

        const SUPABASE_URL =
            "https://fmfyzyxcxhntzkalggmw.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_D2IBmZNyBGWe-MBHB8TczA_UyBOt76l";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================================
           ELEMENTS
           ========================================= */

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        /* =========================================
           SHOW / HIDE PASSWORD
           ========================================= */

        togglePassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                togglePassword.textContent = "Hide";

            } else {

                passwordInput.type = "password";
                togglePassword.textContent = "Show";

            }

        });


        /* =========================================
           LOGIN
           ========================================= */

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();


            const loginInput =
                document.getElementById("loginInput")
                    .value
                    .trim();

            const password =
                passwordInput.value;


            if (!loginInput || !password) {

                message.className = "message error";

                message.textContent =
                    "Please enter your login details.";

                return;

            }


            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";


            try {

                let email = loginInput;


                /*
                 * If the user entered a username,
                 * find the matching email in profiles.
                 */

                if (!loginInput.includes("@")) {

                    const { data: profile, error: profileError } =
                        await supabaseClient
                            .from("profiles")
                            .select("email")
                            .eq("username", loginInput)
                            .maybeSingle();


                    if (profileError) {
                        throw profileError;
                    }


                    if (!profile) {

                        throw new Error(
                            "Username not found."
                        );

                    }


                    email = profile.email;

                }


                /*
                 * Sign in using Supabase Authentication.
                 */

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({

                        email: email,

                        password: password

                    });


                if (error) {
                    throw error;
                }


                /*
                 * Save basic login information.
                 */

                localStorage.setItem(
                    "isLoggedIn",
                    "true"
                );

                localStorage.setItem(
                    "pennyUser",
                    email
                );


                if (data.user) {

                    localStorage.setItem(
                        "pennyUserId",
                        data.user.id
                    );

                }


                message.className =
                    "message success";

                message.textContent =
                    "Login successful. Opening your account...";


                setTimeout(function () {

                    window.location.replace(
                        "dashboard.html"
                    );

                }, 700);


            } catch (error) {

                console.error(
                    "Penny login error:",
                    error
                );


                message.className =
                    "message error";

                message.textContent =
                    error.message ||
                    "Login failed.";


                loginButton.disabled = false;

                loginButton.textContent = "Login";

            }

        });

    </script>

</body>

</html>
