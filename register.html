<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Penny - Create Account</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #07111f, #123d5c);
        }

        .register-box {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .logo {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 15px;
        }

        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 7px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            margin-bottom: 16px;
        }

        input:focus {
            border-color: #1687ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #1687ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #9bbfe5;
            cursor: not-allowed;
        }

        #message {
            display: none;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        #message.success {
            display: block;
            background: #e8f8ee;
            color: #18743b;
        }

        #message.error {
            display: block;
            background: #ffe9e9;
            color: #c62828;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .login a {
            color: #1687ff;
            font-weight: bold;
            text-decoration: none;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <img src="./images/penny1.jpg" class="logo" alt="Penny">

        <h1>Create Account</h1>

        <p class="subtitle">
            Join Penny today
        </p>

        <form id="registerForm">

            <label for="username">Username</label>

            <input type="text" id="username" placeholder="Enter username" minlength="3" required>

            <label for="fullName">Full Name</label>

            <input type="text" id="fullName" placeholder="Enter your full name" required>

            <label for="email">Email</label>

            <input type="email" id="email" placeholder="Enter email address" required>

            <label for="country">Country</label>

            <input type="text" id="country" placeholder="Enter your country" value="Nigeria" required>

            <label for="password">Password</label>

            <input type="password" id="password" placeholder="Create password" minlength="6" required>

            <label for="confirmPassword">Confirm Password</label>

            <input type="password" id="confirmPassword" placeholder="Confirm password" minlength="6" required>

            <div id="message"></div>

            <button id="registerButton" type="submit">
                Create Account
            </button>

        </form>

        <div class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <footer>
            © 2026 Darkharker Tech
        </footer>

    </div>


    <script>

        const SUPABASE_URL =
            "https://fmfyzyxcxhntzkalggmw.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_D2IBmZNyBGWe-MBHB8TczA_UyBOt76l";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        const form =
            document.getElementById("registerForm");

        const button =
            document.getElementById("registerButton");

        const message =
            document.getElementById("message");


        function showMessage(text, type) {

            message.textContent = text;
            message.className = type;

        }


        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            const username =
                document.getElementById("username")
                    .value
                    .trim();

            const fullName =
                document.getElementById("fullName")
                    .value
                    .trim();

            const email =
                document.getElementById("email")
                    .value
                    .trim();

            const country =
                document.getElementById("country")
                    .value
                    .trim();

            const password =
                document.getElementById("password")
                    .value;

            const confirmPassword =
                document.getElementById("confirmPassword")
                    .value;


            if (username.length < 3) {

                showMessage(
                    "Username must be at least 3 characters.",
                    "error"
                );

                return;
            }


            if (password !== confirmPassword) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            button.disabled = true;
            button.textContent = "Creating account...";


            try {

                /*
                 * STEP 1:
                 * Create Supabase Auth account
                 */

                const { data, error } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            data: {
                                username: username,
                                full_name: fullName,
                                country: country
                            }

                        }

                    });


                if (error) {
                    throw error;
                }


                if (!data.user) {
                    throw new Error(
                        "Account was not created. Please try again."
                    );
                }


                /*
                 * STEP 2:
                 * Create the user's profile
                 */

                const { error: profileError } =
                    await supabaseClient
                        .from("profiles")
                        .insert({

                            id: data.user.id,

                            username: username,

                            full_name: fullName,

                            email: email,

                            country: country,

                            balance: 0

                        });


                if (profileError) {
                    throw profileError;
                }


                /*
                 * STEP 3:
                 * Success
                 */

                showMessage(
                    "Account created successfully!",
                    "success"
                );


                form.reset();


                setTimeout(function () {

                    window.location.href = "login.html";

                }, 2000);


            } catch (error) {

                console.error(
                    "Penny registration error:",
                    error
                );


                showMessage(
                    error.message || "Registration failed.",
                    "error"
                );


                button.disabled = false;
                button.textContent = "Create Account";

            }

        });

    </script>

</body>

</html>
