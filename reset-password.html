<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Penny - Reset Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef6ff, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
        }

        /* =========================
           LOGO
        ========================== */

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 130px;
            height: 55px;
            object-fit: contain;
        }

        h1 {
            text-align: center;
            color: #172033;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #697386;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* =========================
           FORM
        ========================== */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #172033;
            font-size: 14px;
            font-weight: 600;
        }

        .password-box {
            position: relative;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border: 1px solid #dbe3ef;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            background: #fbfdff;
        }

        .password-box input {
            padding-right: 65px;
        }

        input:focus {
            border-color: #1677ff;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #1677ff;
            font-weight: 600;
            cursor: pointer;
        }

        /* =========================
           PASSWORD RULES
        ========================== */

        .rules {
            background: #f7faff;
            border: 1px solid #e5edf8;
            border-radius: 9px;
            padding: 13px;
            margin-bottom: 20px;
            color: #697386;
            font-size: 13px;
            line-height: 1.7;
        }

        .rules strong {
            color: #172033;
        }

        /* =========================
           BUTTON
        ========================== */

        .reset-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 9px;
            background: #1677ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #0868eb;
        }

        /* =========================
           MESSAGE
        ========================== */

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #eaf8ef;
            color: #218838;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #c62828;
        }

        /* =========================
           LINKS
        ========================== */

        .links {
            text-align: center;
            margin-top: 22px;
        }

        .links a {
            color: #1677ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 480px) {

            .container {
                padding: 28px 20px;
            }

            .logo img {
                width: 110px;
                height: 48px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- PENNY LOGO -->
        <div class="logo">
            <img src="./images/penny1.jpg" alt="Penny Logo">
        </div>


        <h1>Reset Password</h1>

        <p class="description">
            Create a new password for your Penny account.
        </p>


        <form id="resetForm">

            <!-- NEW PASSWORD -->
            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showNew"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showConfirm"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- PASSWORD RULES -->
            <div class="rules">
                <strong>Password requirements:</strong><br>
                • At least 6 characters<br>
                • Make sure both passwords match
            </div>


            <!-- MESSAGE -->
            <div id="message" class="message"></div>


            <!-- RESET -->
            <button
                type="submit"
                class="reset-btn"
            >
                Reset Password
            </button>

        </form>


        <div class="links">
            <a href="login.html">
                ← Back to Login
            </a>
        </div>

    </div>


    <script>

        /* =========================
           SHOW / HIDE PASSWORD
        ========================== */

        function setupPasswordToggle(buttonId, inputId) {

            const button =
                document.getElementById(buttonId);

            const input =
                document.getElementById(inputId);

            button.addEventListener("click", function() {

                if (input.type === "password") {

                    input.type = "text";
                    button.textContent = "Hide";

                } else {

                    input.type = "password";
                    button.textContent = "Show";

                }

            });
        }


        setupPasswordToggle(
            "showNew",
            "newPassword"
        );

        setupPasswordToggle(
            "showConfirm",
            "confirmPassword"
        );


        /* =========================
           RESET FORM
        ========================== */

        const resetForm =
            document.getElementById("resetForm");

        const message =
            document.getElementById("message");


        resetForm.addEventListener("submit", function(event) {

            event.preventDefault();


            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            message.className = "message";
            message.textContent = "";


            if (newPassword.length < 6) {

                message.className = "message error";

                message.textContent =
                    "Password must be at least 6 characters.";

                return;
            }


            if (newPassword !== confirmPassword) {

                message.className = "message error";

                message.textContent =
                    "The passwords do not match.";

                return;
            }


            /*
            =========================================
            TEMPORARY FRONT-END RESPONSE

            The actual password will only be changed
            after Penny is connected to a secure
            authentication/database system.
            =========================================
            */

            message.className = "message success";

            message.textContent =
                "Your password reset request is ready. Connect Penny to the authentication system to complete the reset.";

        });

    </script>

</body>
</html>
