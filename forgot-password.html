<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Penny - Forgot Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef6ff, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
        }

        /* =========================
           LOGO
        ========================== */

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 130px;       /* Change logo width here */
            height: 55px;       /* Change logo height here */
            object-fit: contain;
        }

        h1 {
            text-align: center;
            color: #172033;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #697386;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* =========================
           FORM
        ========================== */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #172033;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border: 1px solid #dbe3ef;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            background: #fbfdff;
        }

        input:focus {
            border-color: #1677ff;
        }

        /* =========================
           BUTTON
        ========================== */

        .submit-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 9px;
            background: #1677ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #0868eb;
        }

        /* =========================
           MESSAGE
        ========================== */

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #eaf8ef;
            color: #218838;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #c62828;
        }

        /* =========================
           LINKS
        ========================== */

        .links {
            text-align: center;
            margin-top: 22px;
        }

        .links a {
            color: #1677ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-home {
            display: block;
            margin-top: 15px;
            color: #697386 !important;
            font-weight: normal !important;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 480px) {

            .container {
                padding: 28px 20px;
            }

            .logo img {
                width: 110px;
                height: 48px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- PENNY LOGO -->
        <div class="logo">
            <img src="./images/penny1.jpg" alt="Penny Logo">
        </div>


        <h1>Forgot Password?</h1>

        <p class="description">
            Enter the email address associated with your Penny
            account and we'll help you recover access.
        </p>


        <form id="forgotForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    required
                >

            </div>


            <div id="message" class="message"></div>


            <button
                type="submit"
                class="submit-btn"
            >
                Continue
            </button>

        </form>


        <div class="links">

            <a href="login.html">
                ← Back to Login
            </a>

            <a href="register.html" class="back-home">
                Don't have an account? Create one
            </a>

        </div>

    </div>


    <script>

        const forgotForm =
            document.getElementById("forgotForm");

        const message =
            document.getElementById("message");


        forgotForm.addEventListener("submit", function(event) {

            event.preventDefault();


            const email =
                document.getElementById("email").value.trim();


            if (!email) {

                message.className = "message error";

                message.textContent =
                    "Please enter your email address.";

                return;
            }


            /*
            =========================================
            TEMPORARY FRONT-END RESPONSE

            Real password recovery will later be
            connected to the Penny authentication
            system and email service.

            We do not claim that an email was actually
            sent at this stage.
            =========================================
            */

            message.className = "message success";

            message.textContent =
                "Your request has been received. Password recovery will be available after the Penny account system is connected.";

        });

    </script>

</body>
</html>
